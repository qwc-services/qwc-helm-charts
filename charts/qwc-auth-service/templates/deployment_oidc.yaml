{{- if or (eq .Values.mode "oidc") (eq .Values.mode "oidc-db") }}

{{ $dbHostname := (default (printf "%s-qwcdb" .Release.Name) (default .Values.global.db.hostname .Values.authDb.db.hostname)) }}
{{ $dbPort := (default .Values.global.db.port .Values.authDb.db.port) }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qwcAuthService.fullname" . }}-oidc
  labels:
    {{- include "qwcAuthService.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "qwcAuthService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "qwcAuthService.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: default
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: {{ .Chart.Name | lower }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.authOidc.image.repository }}:{{ .Values.authOidc.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.authOidc.image.pullPolicy }}
          ports:
            - name: http-9090
              containerPort: 9090
              protocol: TCP

          env:
            - name: PGSERVICEFILE
              value: /qwc_cfg/pg_service.conf
            - name: CONFIG_PATH
              value: "/qwc_cfg/config"
            - name: SERVICE_MOUNTPOINT
              value: '/auth'
            - name: REQ_HEADER_BUFFER_SIZE
              value: {{ .Values.env.uwsgi.headerSize | default .Values.global.env.uwsgi.headerSize | default 4096 | quote }}
            - name: UWSGI_PROCESSES
              value: {{ .Values.env.uwsgi.nbProcess | default .Values.global.env.uwsgi.nbProcess | default 1 | quote }}
            - name: UWSGI_THREADS
              value: {{ .Values.env.uwsgi.nbThread | default .Values.global.env.uwsgi.nbThread | default 1 | quote }}
            - name: UWSGI_EXTRA
              value: "--thunder-lock --listen {{ .Values.env.uwsgi.queueSize | default .Values.global.env.uwsgi.queueSize | default 64 }}"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.env.jwtSecret.name | default (printf "%s-global-secret" .Release.Name) }}
                  key: {{ .Values.global.env.jwtSecret.key | default "jsonWebToken" }}
            - name: SERVICE_UID
              value: {{ .Values.global.env.serviceUID | default 1000 | quote }}
            - name: SERVICE_GID
              value: {{ .Values.global.env.serviceGID | default 1000 | quote }}
            - name: JWT_COOKIE_CSRF_PROTECT
              value: {{ .Values.env.jwtCookieCSRFProtect | default .Values.global.env.jwtCookieCSRFProtect | default true | quote }}
            - name: JWT_COOKIE_SECURE
              value: {{ .Values.env.jwtCookieSecure | quote }}
            - name: JWT_COOKIE_SAMESITE
              value: {{ .Values.env.jwtCookieSamesite | quote }}

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: vol-pg-service-conf-ro
              mountPath: /qwc_cfg/
              readOnly: true
            - name: vol-config-out-ro
              mountPath: /qwc_cfg/config/
              readOnly: true
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}


      initContainers:
      {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        - name: wait-for-db
          image: busybox:1.28
          command:
            - 'sh'
            - '-c'
            - "until nc -z {{ $dbHostname }} {{ $dbPort }} >/dev/null 2>&1; do echo waiting for qwcDb; sleep 2; done"

        - name: copy-oidc-conf
          image: busybox:1.28
          command:
            - 'sh'
            - '-c'
            - "base64 -d /bootstrap/oidcAuthConfig.json > /qwc_cfg/config/default/oidcAuthConfig.json"
          volumeMounts:
            - name: vol-config-out-ro
              mountPath: /qwc_cfg/config/
              # need write access as we add the oidcAuthConfig.json file inside
              readOnly: false
            - name: oidc-config
              mountPath: /bootstrap/

        - name: insert-admin-group
          image: alpine/psql
          env:
            - name: PGSERVICEFILE
              value: /root/pg_service.conf
          command:
            - 'sh'
            - '-c'
            - |
              base64 -d /bootstrap/insert-admin-group.sh > /tmp/insert-admin-group.sh
              sh /tmp/insert-admin-group.sh
          volumeMounts:
            - name: vol-pg-service-conf-ro
              mountPath: /root/
              readOnly: true
            - name: oidc-config
              mountPath: /bootstrap/

      volumes:
        - name: oidc-config
          configMap:
            name: {{ include "qwcAuthService.fullname" . }}-oidc

        - name: vol-pg-service-conf-ro
          secret:
            secretName: {{ .Values.pgServiceConfSecret.name | default (printf "%s-global-secret" .Release.Name) }}
            optional: false
            items:
              - key: {{ .Values.pgServiceConfSecret.key }}
                path: pg_service.conf

        - name: vol-config-out-ro
          persistentVolumeClaim:
            claimName: {{ include "qwcAuthService.configOutputVolumeClaim" . }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
