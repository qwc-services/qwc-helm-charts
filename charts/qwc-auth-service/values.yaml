# Default values for qwc.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# === authentication mode: db, oidc, partial-oidc, oidc-db
mode: db

authOidc:
  image:
    repository: sourcepole/qwc-oidc-auth
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest-2026-lts

  # ====== Mandatory parameters
  # === Issuer url ie. authentication server. No default.
  # issuerUrl:
  # === Client id to connect to authentication server. No default.
  # clientId:
  # === Client secret to connect to authentication server. No default.
  # clientSecret:
  # === Scopes needed for QWC user info (space separated string of scopes). No default.
  # openidScopes:
  # === Attribute for user name. No default.
  # username:
  # === Attribute name of group memberships
  # groupinfo:
  # === Admin group name. No default.
  # adminGroupName:
  # === DB connection URL (to sync users and user_info_fields) as postgresql:///?service=qwc_configdb. No default.
  # dbUrl:
  # === List of user info fields to get from IdP and to include in JWT identity and DB. Array of strings. No default.
  # userInfoFields:

authDb:
  image:
    repository: sourcepole/qwc-db-auth
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest-2026-lts

  db: {}
    # hostname: qwcdb
    # port: 5432

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 80

livenessProbe:
  httpGet:
    path: /healthz
    port: http-9090
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /ready
    port: http-9090
  initialDelaySeconds: 20
  periodSeconds: 20

# ====== Access to pg_service.conf secret
pgServiceConfSecret:
  # === secret name
  # name:
  # === file key within secret
  key: pg_service_ro.conf

# ====== Chart env variables defined in global or overriden here
env:
  # === CSRF protection
  # jwtCookieCSRFProtect: true
  # === uwsgi parameters
  uwsgi: {}
    # === listen queue size
    # queueSize: 64
    # === http header buffer size
    # headerSize: 12288
    # === number of parallel processes per thread
    # nbProcess: 1
    # === number of parallel threads
    # nbThread: 1

  # ======== GLOBAL ONLY env variables:
  # serviceUID:
  # serviceGID:
  # ====== Access to JWT secret
  # jwtSecret:
  #   === secret name or empty to use the default one: 'RELEASE-global-secret'
  #   name:
  #   === jwt key name within secret or empty to use the default one: 'jsonWebToken'
  #   key:

  # ======== LOCAL only env variables:
  jwtCookieSecure: false
  jwtCookieSamesite: "Lax"

# Overrides claim names.
# If values are setted below, not claim will be created and the deployment will use the overriden claim names.
claimOverrides: {}
  # configOutput: claim-01

# Additional volumes on the output Deployment definition:
volumes: []
# None

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# HTTPRoute configuration for Gateway API
httpRoute:
  enabled:
  hostnames: []
  gateway: {}
    # === k8s gateway name
    # name: aGatewayName
    # === k8s gateway namespace
    # namespace: aNamespaceName
    # sectionName: https
  paths:
    - type: PathPrefix
      value: /auth/

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}

  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
