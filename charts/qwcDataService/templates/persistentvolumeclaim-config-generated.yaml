apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcDataService.configVolumeClaim" . }}
  labels:
    {{- include "qwcDataService.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      {{- include "qwcDataService.configVolumeLabels" . | nindent 6 }}
