{{ if not .Values.claimOverrides.configVolumeClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcOgcService.configVolumeClaim" . }}
  labels:
    {{- include "qwcOgcService.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      {{- include "qwcOgcService.configVolumeLabels" . | nindent 6 }}
{{ end }}
