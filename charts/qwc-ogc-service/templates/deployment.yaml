apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qwcOgcService.fullname" . }}
  labels:
    {{- include "qwcOgcService.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "qwcOgcService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "qwcOgcService.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "qwcOgcService.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: {{ .Chart.Name | lower }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-9090
              containerPort: 9090
              protocol: TCP

          env:
            - name: PGSERVICEFILE
              value: /qwc_cfg/pg_service.conf
            - name: CONFIG_PATH
              value: "/qwc_cfg/config"
            - name: SERVICE_MOUNTPOINT
              value: '/ows'
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.env.jwtSecret.name }}
                  key: {{ .Values.global.env.jwtSecret.key }}
            - name: SERVICE_UID
              value: {{ .Values.global.env.serviceUID | quote }}
            - name: SERVICE_GID
              value: {{ .Values.global.env.serviceGID | quote }}
            - name: JWT_COOKIE_CSRF_PROTECT
              value: {{ .Values.global.env.jwtCookieCSRFProtect | quote }}
            - name: AUTH_REQUIRED
              value: {{ .Values.env.authRequired | quote }}

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: vol-pg-service-conf-rw
              mountPath: /qwc_cfg/
              readOnly: true
            - name: vol-config-ro
              mountPath: /qwc_cfg/config/
              readOnly: true
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}


      volumes:
        - name: vol-pg-service-conf-rw
          secret:
            secretName: {{ .Values.pgServiceConfSecret.name }}
            optional: false
            items:
              - key: {{ .Values.pgServiceConfSecret.key }}
                path: pg_service.conf
        - name: vol-config-ro
          persistentVolumeClaim:
            claimName: {{ include "qwcOgcService.configVolumeClaim" . }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
