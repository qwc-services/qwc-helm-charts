{{ if not .Values.claimOverrides.attachmentVolumeClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcDataService.attachmentVolumeClaim" . }}
  labels:
    {{- include "qwcDataService.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      {{- include "qwcDataService.attachmentVolumeLabels" . | nindent 6 }}
{{ end }}
