{{ if not .Values.claimOverrides.qwcAppVolumeClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcAdminGUI.qwcAppVolumeClaim" . }}
  labels:
    {{- include "qwcAdminGUI.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      {{- include "qwcAdminGUI.qwcAppVolumeLabels" . | nindent 6 }}
{{ end }}
