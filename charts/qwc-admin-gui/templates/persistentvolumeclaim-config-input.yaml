apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcAdminGUI.configInputVolumeClaim" . }}
  labels:
    {{- include "qwcAdminGUI.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      {{- include "qwcAdminGUI.configInputVolumeLabels" . | nindent 6 }}
