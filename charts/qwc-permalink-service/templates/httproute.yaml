{{- if (.Values.httpRoute.enabled | default .Values.global.httpRoute.enabled) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "qwcPermalinkService.fullname" . }}-route
  labels:
    {{- include "qwcPermalinkService.labels" . | nindent 4 }}
spec:
  hostnames:
  {{- if .Values.global.httpRoute.hostnames }}
    {{- range .Values.global.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- else }}
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gateway.name | default .Values.global.httpRoute.gateway.name | default  (printf "%s-gateway" .Release.Name) }}
      namespace: {{ .Values.httpRoute.gateway.namespace | default .Values.global.httpRoute.gateway.namespace | default .Release.Namespace }}
      sectionName: {{ .Values.httpRoute.gateway.sectionName | default .Values.global.httpRoute.gateway.sectionName | default "https" }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ include "qwcPermalinkService.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
      matches:
        {{- range .Values.httpRoute.paths }}
        - path:
            type: {{ .type | default "PathPrefix" }}
            value: {{ .value }}
        {{- else }}
        - path:
            type: PathPrefix
            value: /api/v1/permalink/
        {{- end }}
{{- end }}
