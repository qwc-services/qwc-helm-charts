apiVersion: v1
kind: Service
metadata:
  name: {{ include "qwcPermalinkService.fullname" . }}
  labels:
    {{- include "qwcPermalinkService.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9090
      protocol: TCP
      name: http-9090
  selector:
    {{- include "qwcPermalinkService.selectorLabels" . | nindent 4 }}
