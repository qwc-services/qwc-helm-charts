apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcQgisServer.fullname" . }}-claim
  labels:
    {{- include "qwcQgisServer.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      {{- include "qwcQgisServer.projectResourceVolumeLabels" . | nindent 6 }}
