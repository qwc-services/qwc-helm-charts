# Default values for qwc.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: sourcepole/qwc-qgis-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "3.40"

db: {}
  # hostname: TO_BE_DEFINED
  # port: 5432

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

livenessProbe:
  httpGet:
    path: /
    port: http-1080
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /
    port: http-1080
  initialDelaySeconds: 20
  periodSeconds: 20

# ====== Access to pg_service.conf secret
pgServiceConfSecret:
  # === secret name
  # name:
  # === file key within secret
  key: pg_service_ro.conf

# ====== ENV variables for QGIS Server
env:
  urlPrefix: "/ows"
  apacheLogLevel: "info"
  fcgiIoTimeout: 120
  fcgiMinProcesses: 3
  fcgiMaxProcesses: 100
  fcgiProcessLifeTime: 3600
  fcgiIdleTimeout: 300
  fcgiMaxRequestlen: 26214400 # currently this parameter is not available as it is not read properly by qgis server
  fcgiConnectTimeout: 60
  maxCacheLayers: 500
  qgisProjectSuffix: "qgs"
  dbProjectService: "qgisprojects"
  qgisDebug: 1
  qgisServerAllowedExtraSqlTokens: ""
  qgisServerApiWfs3MaxLimit: 10000
  qgisServerCacheSize: 268435456
  qgisServerDisableGetprint: false
  qgisServerForceReadonlyLayers: false
  qgisServerIgnoreBadLayers: false
  qgisServerLandingPagePrefix: ""
  qgisServerLandingPageProjectsDirectories: ""
  qgisServerLandingPageProjectsPgConnections: ""
  qgisServerLogLevel: 1
  qgisServerLogProfile: false
  qgisServerMaxThreads: -1
  qgisServerOverrideSystemLocale: ""
  qgisServerParallelRendering: false
  qgisServerProjectCacheCheckInterval: 0
  qgisServerProjectCacheStrategy: "filesystem"
  qgisServerServiceUrl: ""
  qgisServerShowGroupSeparator: false
  qgisServerTrustLayerMetadata: 1
  qgisServerWcsServiceUrl: ""
  qgisServerWfsServiceUrl: ""
  qgisServerWmsMaxHeight: -1
  qgisServerWmsMaxWidth: -1
  qgisServerWmsServiceUrl: ""
  qgisServerWmtsServiceUrl: ""
  qgisCustomConfigPath: "/var/lib/qgis"
  qgisAuthDbDirPath: "/var/lib/qgis"
  qgisOptionsPath: "/etc"
  qgisPluginpath: "/usr/share/qgis/python/plugins"
  qgisServerApiResourcesDirectory: "/usr/share/qgis/resources/server/api"
  qgisServerCacheDirectory: "/.cache"
  pgservicefile: "/etc/postgresql-common/pg_service.conf"

# Overrides claim names.
# If values are setted below, not claim will be created and the deployment will use the overriden claim names.
claimOverrides: {}
  # qgisResources: claim-01

# Additional volumes on the output Deployment definition:
volumes: []
# None

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# HTTPRoute configuration for Gateway API
httpRoute:
  enabled:
  hostnames: []
  gateway:
    # === k8s gateway name
    # name: aGatewayName
    # === k8s gateway namespace
    # namespace: aNamespaceName
    sectionName: https
  paths:
    - type: PathPrefix
      value: /

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}

  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
