# Default values for qwc.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: sourcepole/qwc-config-generator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: v2026.01.30

db: {}
  # hostname: qwcdb
  # port: 5432

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 80

# livenessProbe:
#   # exec:
#   #   command:
#   #     - sh
#   #     - "-c"
#   #     - |
#   #       'ps ax -o pid,comm | grep -qi uwsgi'
#   # successThreshold: 1
#   # failureThreshold: 2
#   httpGet:
#     path: /maps?tenant=default
#     port: http-9090
#   initialDelaySeconds: 20
#   periodSeconds: 30

# readinessProbe:
#   httpGet:
#     path: /maps?tenant=default
#     port: http-9090
#   initialDelaySeconds: 20
#   periodSeconds: 20
livenessProbe:
  httpGet:
    path: /healthz
    port: http-9090
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /ready
    port: http-9090
  initialDelaySeconds: 20
  periodSeconds: 20

apiGatewayHostname: ""

# ====== Access to pg_service.conf secret
pgServiceConfSecret:
  # === secret name
  # name:
  # === file key within secret
  key: pg_service_ro.conf

# ====== Chart env variables defined in global or overriden here
env:
  # ======== GLOBAL ONLY env variables:
  # serviceUID:
  # serviceGID:
  # ====== Access to JWT secret
  jwtSecret:
    # === secret name
    # name:
    # === jwt key name within secret
    # key:

# Overrides claim names.
# If values are setted below, not claim will be created and the deployment will use the overriden claim names.
claimOverrides: {}
  # configInput: claim-01
  # configOutput: claim-02
  # qwcApp: claim-03
  # qgisResources: claim-04

# Additional volumes on the output Deployment definition:
volumes: []
# None

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

bootstrap:
  # === ConfigMap name for entrypoint
  # entrypoint:

  # === ConfigMap name for common scripts
  # commonScripts:

  # === ConfigMap name for config input data
  # configIn:

  # === Watchdog file name. Used to tell if we need to create configuration from bootstrap data or keep existing config.
  watchDogFile: default/tenantConfig.json

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}

  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
