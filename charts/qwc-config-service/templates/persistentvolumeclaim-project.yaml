{{ if not .Values.claimOverrides.projectResourceVolumeClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcConfigService.projectResourceVolumeClaim" . }}
  labels:
    {{- include "qwcConfigService.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      {{- include "qwcConfigService.projectResourceVolumeLabels" . | nindent 6 }}
{{ end }}
