{{ $dbHostname := (default .Values.global.db.hostname .Values.db.hostname) }}
{{ $dbPort := (default .Values.global.db.port .Values.db.port) }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qwcConfigService.fullname" . }}
  labels:
    {{- include "qwcConfigService.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "qwcConfigService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "qwcConfigService.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "qwcConfigService.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: {{ .Chart.Name | lower }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-9090
              containerPort: 9090
              protocol: TCP

          env:
            - name: QGIS_SERVER_HOST
              value: {{ .Release.Name }}-qwcqgisserver
            - name: QWC_AUTH_HOST
              value: {{ .Values.apiGatewayHostname }}
            - name: QWC_CONFIG_HOST
              value: {{ .Release.Name }}-qwcconfigservice
            - name: QWC_DATA_HOST
              value: {{ .Values.apiGatewayHostname }}
            - name: QWC_OGC_HOST
              value: {{ .Values.apiGatewayHostname }}
            - name: QWC_PERMALINK_HOST
              value: {{ .Values.apiGatewayHostname }}
            - name: PGSERVICEFILE
              value: /qwc_cfg/pg_service.conf
            - name: INPUT_CONFIG_PATH
              value: "/qwc_cfg/config-in"
            - name: OUTPUT_CONFIG_PATH
              value: "/qwc_cfg/config-generated"
            - name: GENERATE_DYNAMIC_KVRELS
              value: "1"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.env.jwtSecret.name }}
                  key: {{ .Values.global.env.jwtSecret.key }}
            - name: SERVICE_UID
              value: {{ .Values.global.env.serviceUID | quote }}
            - name: SERVICE_GID
              value: {{ .Values.global.env.serviceGID | quote }}
            - name: JWT_COOKIE_CSRF_PROTECT
              value: {{ .Values.global.env.jwtCookieCSRFProtect | quote }}

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: vol-pg-service-conf-ro
              mountPath: /qwc_cfg/
              readOnly: true
            - name: vol-project-resources-ro
              mountPath: /data/
              readOnly: true
            - name: vol-config-in-rw
              mountPath: /qwc_cfg/config-in.template/
              readOnly: false
            - name: vol-config-generated-rw
              mountPath: /qwc_cfg/config-generated/
              readOnly: false
            - name: vol-qwc-app-ro
              mountPath: /qwc2/
              readOnly: false
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}

          command: ["/qwc_cfg/config-in.template/entrypoint.sh"]


      initContainers:
        - name: wait-for-db
          image: busybox:1.28
          command:
            - 'sh'
            - '-c'
            - "until nc -z {{ $dbHostname }} {{ $dbPort }} >/dev/null 2>&1; do echo waiting for qwcDb; sleep 2; done"

      volumes:
        - name: vol-pg-service-conf-ro
          secret:
            secretName: {{ .Values.pgServiceConfSecret.name }}
            optional: false
            items:
              - key: {{ .Values.pgServiceConfSecret.key }}
                path: pg_service.conf
        - name: vol-project-resources-ro
          persistentVolumeClaim:
            claimName: {{ include "qwcConfigService.projectResourceVolumeClaim" . }}
        - name: vol-config-in-rw
          persistentVolumeClaim:
            claimName: {{ include "qwcConfigService.configInputVolumeClaim" . }}
        - name: vol-config-generated-rw
          persistentVolumeClaim:
            claimName: {{ include "qwcConfigService.configVolumeClaim" . }}
        - name: vol-qwc-app-ro
          persistentVolumeClaim:
            claimName: {{ include "qwcConfigService.qwcAppVolumeClaim" . }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
