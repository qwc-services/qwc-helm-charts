apiVersion: v1
kind: Service
metadata:
  name: {{ include "qwcQgisServer.fullname" . }}
  labels:
    {{- include "qwcQgisServer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      # 1080 to avoid root permission under 1024
      targetPort: 1080
      protocol: TCP
      name: http
  selector:
    {{- include "qwcQgisServer.selectorLabels" . | nindent 4 }}
