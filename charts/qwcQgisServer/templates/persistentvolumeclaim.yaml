apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcQgisServer.fullname" . }}-claim
  labels:
    {{- include "qwcQgisServer.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadOnlyMany
  volumeMode: Filesystem
  resources:
    requests:
      storage: 8Gi
#   storageClassName: slow
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "qwcQgisServer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}

