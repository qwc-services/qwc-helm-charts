{{ $dbHostname := printf "hostname=%s" .Values.db.hostname }}
{{ $dbPort := printf "port=%v" .Values.db.port }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qwcQgisServer.pgServiceConfSecret" . }}
  labels: {{- include "qwcQgisServer.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $root := . }}
  {{ range $path, $bytes := .Files.Glob "pg_service_ro.conf" }}
  {{ base $path }}: '{{ $root.Files.Get $path
                        | nindent 2
                        | replace "host=qwcDb" $dbHostname
                        | replace "port=5432" $dbPort
                        | b64enc }}'
  {{ end }}
