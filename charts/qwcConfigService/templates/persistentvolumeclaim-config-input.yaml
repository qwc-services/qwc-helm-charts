apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcConfigService.configInputVolumeClaim" . }}
  labels:
    {{- include "qwcConfigService.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      {{- include "qwcConfigService.configInputVolumeLabels" . | nindent 6 }}
