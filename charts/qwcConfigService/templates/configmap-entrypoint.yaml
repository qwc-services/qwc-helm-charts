kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "qwcConfigService.fullname" . }}-entrypoint
  labels:
    {{- include "qwcConfigService.labels" . | nindent 4 }}
data:
  {{ $root := . }}
  {{ range $path, $bytes := .Files.Glob "*entrypoint.sh" }}
  {{ base $path }}: '{{ $root.Files.Get $path
                        | nindent 2 }}'
  {{ end }}
