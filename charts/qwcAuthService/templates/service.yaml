apiVersion: v1
kind: Service
metadata:
  name: {{ include "qwcAuthService.fullname" . }}
  labels:
    {{- include "qwcAuthService.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9090
      protocol: TCP
      name: http-9090
  selector:
    {{- include "qwcAuthService.selectorLabels" . | nindent 4 }}
