apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcAdminUI.infoTemplateVolumeClaim" . }}
  labels:
    {{- include "qwcAdminUI.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      {{- include "qwcAdminUI.infoTemplateVolumeLabels" . | nindent 6 }}
