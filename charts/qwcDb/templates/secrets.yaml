apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qwcDb.secrets" . }}
  labels: {{- include "qwcDb.labels" . | nindent 4 }}
type: Opaque
data:
  postgresPassword: {{ .Values.global.postgresqlSecrets.mainPassword | b64enc | quote }}
  postgresUser: {{ .Values.global.postgresqlSecrets.mainUser | b64enc | quote }}
