apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcDb.fullname" . }}-claim
  labels:
    {{- include "qwcDb.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 30Gi
#   storageClassName: slow
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "qwcDb.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}

