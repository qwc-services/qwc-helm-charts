# Default values for qwc-db.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: sourcepole/qwc-base-db
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 5432

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  exec:
    command: ["pg_isready", "-U", "postgres"]
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  exec:
    command: ["pg_isready", "-U", "postgres"]
  initialDelaySeconds: 10
  periodSeconds: 10

# Mandatory volumes needed on the output Deployment definition.
volume-db-data-path: TO_BE_SET

volumes:
  - name: qwc-db-init
    # # dev mode ONLY
    # hostPath:
    #   path: ./volumes/db-init/setup-qwc.sh
    #   type: File
  - name: qwc-db-data
    # # dev mode ONLY
    # hostPath:
    #   path: ./volumes/db
    #   type: Directory
    # # prod example, see https://kubernetes.io/docs/concepts/storage/volumes/#volume-types
    # nfs:
    #   server: 192.168.0.40
    #   path: /document
    #   readOnly: true

# Additional volumes on the output Deployment definition:
# None

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
