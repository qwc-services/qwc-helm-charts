{{ if .Values.createDb }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qwcDb.fullname" . }}
  labels:
    {{- include "qwcDb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    {{- include "qwcDb.selectorLabels" . | nindent 4 }}
{{ end }}
