apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "qwc-db.fullname" . }}
  labels:
    {{- include "qwc-db.labels" . | nindent 4 }}
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: {{ .Values.volumeDbDataPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: NotIn
          values:
          - SpecificOne