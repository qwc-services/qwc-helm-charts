apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qwcDb.secrets" . }}
  labels:
    {{- include "qwcDb.labels" . | nindent 4 }}
type: Opaque
data:
  postgresPassword: {{ .Values.global.db.secrets.mainPassword | b64enc | quote }}
  postgresUser: {{ .Values.global.db.secrets.mainUser | b64enc | quote }}
