apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qwcDb.secrets" . }}
  labels:
    {{- include "qwcDb.labels" . | nindent 4 }}
type: Opaque
data:
  {{ range $k, $v := .Values.global.db.secrets }}
  {{ printf "%sUser" $k }}: {{ $v.user | b64enc | quote }}
  {{ printf "%sPassword" $k }}: {{ $v.password | b64enc | quote }}
  {{ end }}
