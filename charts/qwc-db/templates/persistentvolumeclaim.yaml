apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwc-db.fullname" . }}
  labels:
    {{- include "qwc-db.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 8Gi
#   storageClassName: slow
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "qwc-db.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}

