{{ if not .Values.claimOverrides.pgDataVolumeClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwcDb.pgDataVolumeClaim" . }}
  labels:
    {{- include "qwcDb.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 30Gi
  selector:
    matchLabels:
      {{- include "qwcDb.pgDataVolumeLabels" . | nindent 6 }}
{{ end }}
