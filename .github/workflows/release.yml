name: Helm Release

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          # Find directories containing Chart.yaml and format as JSON array
          CHARTS=$(find . -name "Chart.yaml" -exec dirname {} \; | jq -R . | jq -s -c .)
          echo "matrix=$CHARTS" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        helm_path: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Determine Tag and Image Name
        id: meta
        run: |
          NAME=$(grep '^name: ' ${{ matrix.helm_path }}/Chart.yaml | awk '{print $2}')
          VERSION=$(grep '^version: ' ${{ matrix.helm_path }}/Chart.yaml | awk '{print $2}')

          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            TAG="pr-${{ github.event.pull_request.number }}-$VERSION"
          elif [[ ${{ github.ref }} == refs/tags/* ]]; then
            TAG="$VERSION"
          else
            TAG="dev"
          fi

          echo "image_name=$NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package and Push to GHCR
        run: |
          helm package -u ${{ matrix.helm_path }}

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

          CHART_FILE=$(ls *.tgz | head -n 1)
          helm push $CHART_FILE oci://ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.image_name }} \
            --version ${{ steps.meta.outputs.tag }}
