# ====================================
# Default values for qwc.
#
# Note: the prefix 'my-qwc-instance' is the name of the helm instance used when installing the chart with this command:
# `helm upgrade -f values.yaml -f secret-values.yaml --install my-qwc-instance .`
# ====================================

# ====================================
# ================ GLOBAL VAR

global:
  db:
    hostname: my-qwc-instance-qwcdb
    port: 5432

  env:
    serviceUID: 1000
    serviceGID: 1000

    jwtSecret:
      name: my-qwc-instance-global-secret
      key: jwtSecretKey

    jwtCookieCSRFProtect: true

# ====================================
# ================ VOLUMES
#
# In production mode:
# * volumes are created by administrator and won't be created by this chart ==> `createVolumes: false`
# * `volumePaths` should be empty
#
# In dev mode:
# * volumes could be created by this chart with: `createVolumes: true`
# * `volumePaths` must be defined

createVolumes: true
volumePaths:
  - name: vol-db-data-rw
    path: /data/

  - name: vol-project-resources-ro
    path: /data/qgs-resources/

  - name: vol-config-in-ro
    path: /data/config-in/

  - name: vol-config-generated
    path: /data/config/

  - name: vol-qwc-app-ro
    path: /data/qwc2/

  - name: vol-attachment-rw
    path: /data/attachments/

  - name: vol-info-template
    path: /data/info-templates/

# ====================================
# ================ SUB CHARTS

qwcQgisServer:
  image:
    tag: 3.28-plugins

  pgServiceConfSecret:
    name: my-qwc-instance-global-secret
    key: pg_service_ro.conf
  jwtSecret:
    name: my-qwc-instance-global-secret
    key: jwtSecretKey

  # -----------
  # claim can be overridden:
  # claimOverrides:
  #     projectResourceVolumeClaim: claim-01

