# Default values for qwc.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  db:
    hostname: qwc-test-qwcdb
    port: 5432

volumePaths:
  - name: vol-db-data-rw
    path: /data/

  - name: vol-project-resources-ro
    path: /data/qgs-resources/

  - name: vol-config-in-ro
    path: /data/config-in/

  - name: vol-config-generated
    path: /data/config/

  - name: vol-qwc-app-ro
    path: /data/qwc2/

  - name: vol-attachment-rw
    path: /data/attachments/

  - name: vol-info-template
    path: /data/info-templates/

qwcQgisServer:
  image:
    tag: 3.28-plugins

  pgServiceConfSecret:
    name: qwc-test-global-secret
    key: pg_service_ro.conf
  jwtSecret:
    name: qwc-test-global-secret
    key: jwtSecretKey

qwcDb:
  image:
    tag: 15

  # used by qwc-base-db-migrate
  pgServiceConfSecret:
    name: qwc-test-global-secret
    key: pg_service_ro.conf
  jwtSecret:
    name: qwc-test-global-secret
    key: jwtSecretKey

  # dbSecret:
  #   user:
  #     name: qwc-test-qwcdb-secret
  #     key: postgresPassword
  #   password:
  #     name: qwc-test-qwcdb-secret
  #     key: postgresUser

