# Default values for qwc.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  db:
    hostname: qwc-test-qwcdb
    port: 5432

volumePaths:
    - name: vol-db-data-rw
      path: /home/bde/prog/2306_10_grandlyon_geonet/qwc-helm/volumes/db/
    - name: vol-project-resources-ro
      path: /home/bde/prog/2306_10_grandlyon_geonet/qwc-helm/volumes/qwc-resources/
    - name: vol-config-in-ro
      path: /home/bde/prog/2306_10_grandlyon_geonet/qwc-helm/volumes/config-in/
    - name: vol-config-generated
      path: /home/bde/prog/2306_10_grandlyon_geonet/qwc-helm/volumes/config/
    - name: vol-qwc-app-ro
      path: /home/bde/prog/2306_10_grandlyon_geonet/qwc-helm/volumes/qwc2/

qwcQgisServer:
  image:
    tag: 3.28-plugins

  pgServiceConfSecret:
    name: qwc-test-secret-pg-service
    key: pg_service_ro.conf

