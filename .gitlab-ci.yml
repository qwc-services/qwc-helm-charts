# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  GITLAB_ENV: $CI_COMMIT_REF_NAME
  PROJECT_ID: 89048340

stages:
  - lint
  - test
  - build

secret_detection:
  stage: lint

helm-pre-commit:
  stage: lint
  image: jfxs/pre-commit:4
  variables:
    PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
  cache:
    - key:
        files: [.pre-commit-config.yaml]
      paths:
        - .cache/pre-commit/
  before_script:
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash
    - apt update && apt install -y shellcheck
    - ln -s values-local.yaml.sample values.yaml
  script:
    - pre-commit run --all-files

sast:
  stage: test

build:build_helm:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG
  image:
    name: alpine/helm:4
    entrypoint: [""]
  parallel:
    matrix:
      - HELM_PATH:
          - "./"
          - "./charts/qwc-admin-gui"
          - "./charts/qwc-auth-service"
          - "./charts/qwc-config-service"
          - "./charts/qwc-data-service"
          - "./charts/qwc-db"
          - "./charts/qwc-ogc-service"
          - "./charts/qwc-permalink-service"
          - "./charts/qwc-map-viewer"
  script:
    - helm package -u $HELM_PATH
    - |
      export NAME=$(egrep '^name: \w*' $HELM_PATH/Chart.yaml | sed -E 's/^name: ((\w|-)*).*$/\1/g')
    - |
      export VERSION=$(egrep '^version: [0-9]+' $HELM_PATH/Chart.yaml | sed -E 's/^version: (([0-9]|\.)+).*$/\1/g')
    - |
      export CHANNEL=dev
      [ -n "$CI_COMMIT_TAG" ] && export CHANNEL=stable
    - curl --request POST --form "chart=@$NAME-$VERSION.tgz" --user gitlab-ci-token:$CI_JOB_TOKEN ${CI_API_V4_URL}/projects/${PROJECT_ID}/packages/helm/api/${CHANNEL}/charts

  environment:
    name: $GITLAB_ENV
