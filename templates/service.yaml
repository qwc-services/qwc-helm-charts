apiVersion: v1
kind: Service
metadata:
  name: {{ include "qwc.fullname" . }}
  labels:
    {{- include "qwc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 1080
      protocol: TCP
      name: http
  selector:
    {{- include "qwc.selectorLabels" . | nindent 4 }}
