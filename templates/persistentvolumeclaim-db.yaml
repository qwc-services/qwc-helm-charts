{{- if and .Values.qwcDb.enabled .Values.qwcDb.createDb }}
{{- $dbBlock := .Values.global.persistence.db | default dict }}
{{- $storClassName := $dbBlock.storageClassName -}}
{{- if (not $dbBlock.claimOverride) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwc.pgDataVolumeClaim" . }}
  labels:
    {{- include "qwc.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $storClassName }}
  resources:
    requests:
      storage: {{ $dbBlock.size | default "30Gi" }}
  {{- if eq $storClassName "local-storage" }}
  selector:
    matchLabels:
      {{- include "qwc.pgDataVolumeLabels" . | nindent 6 }}
  {{- end }}
{{- end }}
{{- end }}
