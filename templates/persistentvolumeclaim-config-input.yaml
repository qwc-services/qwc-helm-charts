{{ if (not .Values.global.persistence.configInput.claimOverride) }}
{{- $storClassName := .Values.global.persistence.configInput.storageClassName -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qwc.configInputVolumeClaim" . }}
  labels:
    {{- include "qwc.labels" . | nindent 4 }}
  annotations:
    # Helm keeps this claim on uninstall, on rollback and when it leaves the chart,
    # so the volume and its data stay in place.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ $storClassName }}
  resources:
    requests:
      storage: {{ .Values.global.persistence.configInput.size | default "10Gi" }}
  {{- if eq $storClassName "local-storage" }}
  selector:
    matchLabels:
      {{- include "qwc.configInputVolumeLabels" . | nindent 6 }}
  {{- end }}
{{ end }}
