apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bootstrap-config-in
  labels:
    {{- include "qwc.labels" . | nindent 4 }}
data:
  {{ $root := . }}
  {{ range $path, $bytes := .Files.Glob "bootstrap/config/**" }}
  {{ $path | trimPrefix "bootstrap/config/" | replace "/" "--" }}: '{{ $root.Files.Get $path | b64enc }}'
  {{ end }}
