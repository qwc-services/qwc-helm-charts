apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "qwcQgisServer.fullname" .Subcharts.qwcQgisServer }}
  labels:
    {{- include "qwcQgisServer.labels" .Subcharts.qwcQgisServer | nindent 4 }}
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: {{ .Values.qwcQgisServer.volumeResourcePath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: NotIn
          values:
          - SpecificOne