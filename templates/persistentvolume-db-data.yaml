apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "qwc.fullname" . }}-data
  labels:
    {{- include "qwc.labels" . | nindent 4 }}
    {{- include "qwcDb.pgDataVolumeLabels" .Subcharts.qwcDb | nindent 4 }}
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage

  local:
    path:
  {{- range .Values.volumePaths }}
  {{- if eq .name "vol-db-data-rw" -}}
    {{ printf " %s" .path }}
  {{- end }}
  {{- end }}

  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: NotIn
          values:
          - SpecificOne
