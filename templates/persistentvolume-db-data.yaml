apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "qwcDb.fullname" .Subcharts.qwcDb }}
  labels:
    {{- include "qwcDb.labels" .Subcharts.qwcDb | nindent 4 }}
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: {{ .Values.qwcDb.volumeDataPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: NotIn
          values:
          - SpecificOne