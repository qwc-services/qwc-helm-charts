apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bootstrap-common-scripts
  labels:
    {{- include "qwc.labels" . | nindent 4 }}
data:
  {{ $root := . }}
  {{ range $path, $bytes := .Files.Glob "bootstrap/scripts/*" }}
  {{ $path | trimPrefix "bootstrap/scripts/" | replace "/" "--" }}: '{{ $root.Files.Get $path | b64enc }}'
  {{ end }}
