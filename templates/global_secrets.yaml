{{ $dbHostname := printf "host=%s" .Values.global.db.hostname }}
{{ $dbPort := printf "port=%v" .Values.global.db.port }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qwc.globalSecret" . }}
  labels:
    {{- include "qwc.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $root := . }}
  {{ range $path, $bytes := .Files.Glob "pg_service*.conf" }}
  {{ base $path }}: '{{ $root.Files.Get $path
                        | replace "host=qwcDb" $dbHostname
                        | replace "port=5432" $dbPort
                        | b64enc }}'
  {{ end }}
  jwtSecretKey: {{ .Values.global.jwtSecretKey | b64enc | quote }}
