{{ $dbHostname := printf "host=%s" (default (printf "%s-qwcdb" .Release.Name) .Values.global.db.hostname) }}
{{ $dbPort := printf "port=%v" .Values.global.db.port }}
{{ $qwcAdminPwd := printf "password=%v" .Values.global.db.secrets.qwcAdminPassword }}
{{ $qwcServiceReadPwd := printf "password=%v" .Values.global.db.secrets.qwcServiceReadPassword }}
{{ $qwcServiceWritePwd := printf "password=%v" .Values.global.db.secrets.qwcServiceWritePassword }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qwc.globalSecret" . }}
  labels:
    {{- include "qwc.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $root := . }}
  {{ range $path, $bytes := .Files.Glob "pg_service*.conf" }}
  {{ base $path }}: '{{ $root.Files.Get $path
                        | replace "host={{ qwc_db_host }}" $dbHostname
                        | replace "port={{ qwc_db_port }}" $dbPort
                        | replace "password={{ qwc_admin_pwd }}" $qwcAdminPwd
                        | replace "password={{ qwc_service_pwd }}" $qwcServiceReadPwd
                        | replace "password={{ qwc_service_write_pwd }}" $qwcServiceWritePwd
                        | b64enc }}'
  {{ end }}
  jsonWebToken: {{ .Values.global.jsonWebToken | b64enc | quote }}
