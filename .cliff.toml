# cliff.toml
[changelog]
header = """
# Changelog\n
All notable changes to this chart and subcharts will be documented in this file.\n
"""

body = """
{% if version %}\
    ## **{{ version | trim_start_matches(pat="v") }}** - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## **Unreleased**
{% endif %}\
{% for group, grouped_commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for scope, scoped_commits in grouped_commits | group_by(attribute="scope") %}
        - *{{ scope | upper_first }}*:\
        {% for commit in scoped_commits %}
            {% raw %}  {% endraw %}- {{ commit.message | upper_first }}\
            {%- if commit.breaking %}
            {% raw %}  {% endraw %}  **BREAKING**: {{commit.breaking_description}}
            {%- endif -%}
        {% endfor %}
    {% endfor %}
    {% set_global count = 0 %}\
    {%- for commit in grouped_commits %}\
        {%- if commit.scope -%}\
        {% else -%}\
        {% set_global count = count + 1 %}\
        {% endif -%}\
    {% endfor -%}
    {%- if count > 0 %}\
      - *no scope*:{% raw %}\n{% endraw %}\
      {%- for commit in grouped_commits %}
          {%- if commit.scope -%}
          {% else -%}
              {% raw %}  {% endraw %}- {{ commit.message | upper_first }}\n\
              {% if commit.breaking -%}
              {% raw %}  {% endraw %}- **BREAKING**: {{commit.breaking_description}}
              {% endif -%}
          {% endif -%}
      {% endfor -%}
    {% endif -%}
   {% raw %}{% endraw %}
{% endfor %}\n
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore", skip = true },
]
filter_commits = false
