# cliff.toml
[changelog]
header = """
# Changelog\n
All notable changes to this chart and subcharts will be documented in this file.\n
"""

body = """
{% if version %}\
    ## **{{ version | trim_start_matches(pat="v") }}** - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## **Unreleased**
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""

footer = """
## How to\n
\n
Replace `MY_PREV_TAG` and run: `docker run -t -v "$(pwd)":/app/ "ghcr.io/orhun/git-cliff/git-cliff:latest" --unreleased --prepend CHANGELOG.md -- MY_PREV_TAG..HEAD`\n
\n
<!-- generated by git-cliff -->\n
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore", skip = true },
]
filter_commits = false
